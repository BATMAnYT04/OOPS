<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OOPS! Logo download</title><style>body{font:16px system-ui;background:#08070f;color:#f5f2ff;max-width:600px;margin:60px auto;padding:20px}img{width:100%;height:auto;display:block;background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/24px 24px}button{font:inherit;background:#a33dff;color:white;border:0;padding:14px 24px;border-radius:30px;cursor:pointer}button:disabled{opacity:.5}p{color:#c8bddb}</style></head><body><h1>OOPS! logo</h1><div class="site-header"><div class="brand"><img src="logo.png" alt="OOPS! logo"></div></div><p id="status">Preparing transparent PNG…</p><button id="download" disabled>Download logo PNG</button><script>
/* Remove the logo's border-connected solid background without changing the original asset. */
(()=>{const logo=document.querySelector('.site-header .brand img');if(!logo)return;function makeTransparent(){try{const w=logo.naturalWidth,h=logo.naturalHeight;if(!w||!h)return;const scale=Math.min(1,640/Math.max(w,h)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)return;const W=canvas.width,H=canvas.height;ctx.drawImage(logo,0,0,W,H);const im=ctx.getImageData(0,0,W,H),p=im.data;const corners=[0,W-1,(H-1)*W,W*H-1];if(corners.some(i=>p[i*4+3]<30))return;const colors=corners.map(i=>[p[i*4],p[i*4+1],p[i*4+2]]);const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);const bg=colors.reduce((best,c)=>colors.filter(x=>dist(x,c)<45).length>colors.filter(x=>dist(x,best)<45).length?c:best,colors[0]);if(colors.filter(x=>dist(x,bg)<45).length<3)return;const seen=new Uint8Array(W*H),queue=new Int32Array(W*H);let tail=0,head=0;const delta=i=>Math.hypot(p[i*4]-bg[0],p[i*4+1]-bg[1],p[i*4+2]-bg[2]);function visit(i){if(seen[i])return;seen[i]=1;if(delta(i)<=48||p[i*4+3]===0)queue[tail++]=i}for(let x=0;x<W;x++){visit(x);visit((H-1)*W+x)}for(let y=0;y<H;y++){visit(y*W);visit(y*W+W-1)}while(head<tail){const i=queue[head++],x=i%W,y=Math.floor(i/W);p[i*4+3]=0;if(x>0)visit(i-1);if(x<W-1)visit(i+1);if(y>0)visit(i-W);if(y<H-1)visit(i+W)}if(tail< W*H*.015||tail>W*H*.96)return;ctx.putImageData(im,0,0);logo.src=canvas.toDataURL('image/png');}catch(err){/* keep original if image processing is unavailable */}}if(logo.complete)makeTransparent();else logo.addEventListener('load',makeTransparent,{once:true})})();
</script><script>const img=document.querySelector('img'),button=document.querySelector('#download'),status=document.querySelector('#status');function ready(){if(!img.naturalWidth)return;button.disabled=false;status.textContent=img.src.startsWith('data:')?'Background removal applied. Preview above.':'Original image shown; background removal could not be confirmed.'}img.addEventListener('load',ready);if(img.complete)ready();button.addEventListener('click',()=>{const a=document.createElement('a');a.href=img.src;a.download=img.src.startsWith('data:')?'OOPS-transparent.png':'OOPS-original.png';a.click()})</script></body></html>
